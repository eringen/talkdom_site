<div class="p-6 space-y-6"><div><h2 class="text-2xl font-bold font-mono text-gray-100">Semicolons</h2><span class="inline-block mt-1 px-2 py-0.5 text-xs uppercase tracking-widest font-semibold text-amber-400 bg-amber-400/10 rounded">Syntax · 0.5.0</span></div><div><p class="text-gray-300 leading-relaxed mb-3">Start independent chains in parallel.</p></div><div><h3 class="text-sm font-semibold text-gray-500 mb-2">Example</h3><pre class="bg-gray-900 border border-gray-700 rounded-lg p-4 font-mono text-sm text-gray-200 overflow-x-auto"><code>a get: /first apply: inner; b get: /second apply: inner</code></pre></div><ul class="list-disc list-inside text-sm text-gray-400 space-y-2"><li>The public promise resolves when all chains succeed. A failure rejects without cancelling other started work.</li></ul></div>
