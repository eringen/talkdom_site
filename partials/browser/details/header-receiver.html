<div class="p-6 space-y-6"><div><h2 class="text-2xl font-bold font-mono text-gray-100">X-TalkDOM-Receiver</h2><span class="inline-block mt-1 px-2 py-0.5 text-xs uppercase tracking-widest font-semibold text-amber-400 bg-amber-400/10 rounded">Request header · 0.5.0</span></div><div><p class="text-gray-300 leading-relaxed mb-3">Identify the receiver that initiated the request.</p></div><div><h3 class="text-sm font-semibold text-gray-500 mb-2">Example</h3><pre class="bg-gray-900 border border-gray-700 rounded-lg p-4 font-mono text-sm text-gray-200 overflow-x-auto"><code>&lt;div receiver=&quot;feed news&quot;&gt;&lt;/div&gt;
// Header: X-TalkDOM-Receiver: feed</code></pre></div><ul class="list-disc list-inside text-sm text-gray-400 space-y-2"><li>Uses the first receiver name, even when addressed by an alias.</li><li>Names use consistent whitespace parsing.</li></ul></div>
